name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Install an npm CLI that supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Require the tag to match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version."
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ""
        run: |
          npm config delete //registry.npmjs.org/:_authToken --location=user || true
          npm publish --access public
